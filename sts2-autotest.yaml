# STS2-AUTOTEST 工作区配置
#
# 声明公共服务可见的 MOD 项目。公共任务携带 project 参数时，
# 平台经 manifest 指针解析项目根目录，并读取该项目自己的
# project_extension 配置（见 adapters/project_extension.py）。
# 路径相对于本文件所在目录，标准工作区布局（各仓库平级）下可直接使用。
workspace:
  projects:
    - name: gawain
      manifest: ../STS2-GAWAIN/sts2-mod.yaml
      spec_dir: ../STS2-GAWAIN/automation/autotest/specs
      output_dir: ../STS2-GAWAIN/automation/autotest/generated
