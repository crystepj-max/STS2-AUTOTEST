name: CI — Pull Request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: PR Check Summary
    runs-on: ["self-hosted", "macos", "autotest"]
    # job 级兜底须 ≥ 各 step 兜底上限之和（ruff 25 + unit 35 + mypy 35 = 95min
    # + 安装/集成等步骤），否则多检查同时接近上限时 job 被平台硬杀，
    # summary 与 check-logs 上传均不执行，Timeout 呈现和输出保留同时失效
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner health precheck (issue-24 T4)
        # 业务验收开始前判定 runner 是否可用（服务状态 + GitHub 网络链路），
        # 不可用则快速失败，避免排队/执行后才发现环境故障
        run: |
          bash scripts/check-runner-health.sh --json
          echo "## Runner Health Precheck" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/check-runner-health.sh --json >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline

      - name: Verify Python 3.11
        id: python
        continue-on-error: true
        run: python3.11 --version

      - name: Install project dev dependencies
        id: install
        if: always() && steps.python.outcome == 'success'
        continue-on-error: true
        run: |
          python3.11 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -e ".[dev]"
          # issue-21：固定 lint 工具版本（不带 --no-deps，保留 mypy 运行时依赖），
          # 防止 PR 通过修改 pyproject.toml 依赖范围改变检查工具版本
          .venv-ci/bin/python -m pip install -r .github/requirements-lint.txt --force-reinstall
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Controlled timeout verification (issue-18)
        # 受控超时验证：以 2 秒上限运行 300 秒 sleep，断言 timed_out 且进程无残留。
        # 证明超时机制在真实 runner 上能终止进程，且本步骤之后的检查仍可继续运行。
        # 若 kill 失效（残留进程存活），此步骤失败并阻断 PR。
        id: timeout_demo
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          .venv-ci/bin/python - <<'PY'
          import sys
          import time

          sys.path.insert(0, ".github/scripts")
          import psutil
          from runner_utils import run_timed

          result = run_timed(
              "timeout-demo",
              [
                  sys.executable,
                  "-c",
                  "import os, time; print('DEMO_PID=' + str(os.getpid()), flush=True); time.sleep(300)",
              ],
              "timeout-demo.log",
              timeout=2,
          )
          if not result.timed_out:
              raise SystemExit(f"controlled timeout failed: no TIMEOUT (rc={result.returncode})")
          pid = int(next(line.split("=", 1)[1] for line in result.output.splitlines() if line.startswith("DEMO_PID=")))
          deadline = time.monotonic() + 10
          while psutil.pid_exists(pid) and time.monotonic() < deadline:
              time.sleep(0.1)
          if psutil.pid_exists(pid):
              raise SystemExit(f"controlled timeout failed: child {pid} still alive")
          print(f"CONTROLLED TIMEOUT OK: exit={result.returncode}, no residual process")
          PY

      - name: Install baseline lint environment (issue-21)
        # 基线独立 venv：用基线自身 dev 依赖 + 固定 lint 工具，隔离 PR 依赖变化对比较的污染
        id: baseline_install
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python3.11 -m venv .venv-baseline
          cd .ci-baseline
          ../.venv-baseline/bin/python -m pip install -e ".[dev]"
          ../.venv-baseline/bin/python -m pip install -r ../.github/requirements-lint.txt --force-reinstall
          cd ..

      - name: Check no new Ruff debt
        id: ruff
        if: always() && steps.baseline_install.outcome == 'success'
        continue-on-error: true
        # 兜底 step 上限须大于脚本最坏耗时（脚本对 baseline/current 各跑一次，
        # 单次上限 RUFF_TIMEOUT_SECONDS=600s），保证脚本自身先报 Timeout 而非被 step 硬杀
        timeout-minutes: 25
        # --ruff-bin/--baseline-ruff-bin 固定工具路径：基线用独立 venv 的 ruff（issue-21）
        run: .venv-ci/bin/python .github/scripts/check_ruff_baseline.py --baseline-dir .ci-baseline --current-dir . --ruff-bin .venv-ci/bin/ruff --baseline-ruff-bin .venv-baseline/bin/ruff

      - name: Run lint-imports
        id: imports
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/lint-imports

      - name: Run runner script tests (issue-24)
        # 自托管 runner 运维脚本（runner-ctl/setup/probe/health）的 shell 测试；
        # 必须随 PR 必跑，防止脚本回归在 CI 绿灯下漏网
        id: script_tests
        run: bash scripts/tests/run-all.sh

      - name: Check no new unit-test failures
        id: unit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        # 兜底 step 上限须大于脚本单次上限（PYTEST_TIMEOUT_SECONDS=1800s + 清理宽限）
        timeout-minutes: 35
        # --baseline-json 必须指向 base SHA 版本，防止 PR 修改当前清单扩大允许失败范围（issue-21）
        run: .venv-ci/bin/python .github/scripts/check_pytest_baseline.py --baseline-json .ci-baseline/.github/pytest-baseline.json

      - name: Verify real STS2 CLI is available
        id: cli_check
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          .venv-ci/bin/python - <<'PY'
          from sts2_autotest.adapters.discovery import discover_sts2_cli

          cli_path = discover_sts2_cli()
          if cli_path is None:
              raise SystemExit(
                  "STS2 CLI was not found on the self-hosted Mac. "
                  "Set STS2_CLI_PATH for the runner service or install the CLI in a discoverable path."
              )
          print(f"Using STS2 CLI: {cli_path}")
          PY

      - name: Run CLI-only integration tests
        id: cli_tests
        if: always() && steps.cli_check.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python -m pytest tests/integration/ -v -m "not requires_game" --junitxml=junit-integration.xml

      - name: Upload unit JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-macos-self-hosted
          path: junit-unit.xml

      - name: Upload integration JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

      - name: Install visual dependency for mypy
        id: visual
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python -m pip install -e ".[visual]"

      - name: Check no new mypy debt
        id: mypy
        if: always() && steps.visual.outcome == 'success' && steps.baseline_install.outcome == 'success'
        continue-on-error: true
        # 兜底 step 上限须大于脚本最坏耗时（脚本对 baseline/current 各跑一次，
        # 单次上限 MYPY_TIMEOUT_SECONDS=900s），保证脚本自身先报 Timeout 而非被 step 硬杀
        timeout-minutes: 35
        # --config-file/--mypy-bin/--baseline-mypy-bin：政策配置与工具路径固定（issue-21）
        run: .venv-ci/bin/python .github/scripts/check_mypy_baseline.py --baseline-dir .ci-baseline --current-dir . --config-file .github/mypy-policy.ini --mypy-bin .venv-ci/bin/mypy --baseline-mypy-bin .venv-baseline/bin/mypy

      - name: Upload check logs (issue-18)
        # 超时时已产生的 stdout/stderr 与日志均落盘在 check log 中，随 artifact 保留供诊断。
        # 必须晚于所有产生日志的步骤（mypy 依赖 visual 排在更后）：上传发生在
        # mypy 之前会导致 mypy-check.log 永不进入 artifact，mypy 超时诊断输出完全丢失。
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ruff-check.log
            mypy-check.log
            pytest-check.log
            timeout-demo.log

      - name: Check workflow artifact step order (issue-51)
        # 静态校验 upload-artifact 必须晚于 manifest 声明的 producer 步骤；乱序则 fail-closed。
        id: workflow_artifact_order
        if: always() && steps.install.outcome == 'success'
        run: .venv-ci/bin/python .github/scripts/check_workflow_artifact_order.py

      - name: Generate summary
        if: always()
        run: |
          echo "## STS2-AUTOTEST — PR Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Daily PR validation currently runs only on the existing self-hosted Mac; GitHub-hosted Linux/Windows duplication is temporarily disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python 3.11 | ${{ steps.python.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Install dev dependencies | ${{ steps.install.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          # 脚本超时（exit 124）会写入 GITHUB_OUTPUT timeout=true，与普通质量失败区分
          if [ "${{ steps.timeout_demo.outcome }}" = "success" ]; then
            echo "| Controlled timeout verification | OK (timed out as expected) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Controlled timeout verification | ${{ steps.timeout_demo.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.ruff.outputs.timeout }}" = "true" ]; then
            echo "| Ruff baseline | Timeout (124) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Ruff baseline | ${{ steps.ruff.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.mypy.outputs.timeout }}" = "true" ]; then
            echo "| mypy baseline | Timeout (124) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| mypy baseline | ${{ steps.mypy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Import layer | ${{ steps.imports.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner script tests | ${{ steps.script_tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.unit.outputs.timeout }}" = "true" ]; then
            echo "| Unit tests | Timeout (124) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Unit tests | ${{ steps.unit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Real STS2 CLI discovery | ${{ steps.cli_check.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLI integration | ${{ steps.cli_tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce validation result
        if: always()
        run: |
          failed=0
          check() {
            name="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          }
          # 超时失败同样视为验收失败，但错误信息明确包含 Timeout 而非普通质量失败
          check_timeout() {
            name="$1"
            outcome="$2"
            marker="$3"
            if [ "$outcome" != "success" ]; then
              if [ "$marker" = "true" ]; then
                echo "::error::$name TIMEOUT: exceeded time limit (exit 124); partial output in check-logs artifact"
              else
                echo "::error::$name outcome: $outcome"
              fi
              failed=1
            fi
          }

          check "Python 3.11" "${{ steps.python.outcome }}"
          check "Install dev dependencies" "${{ steps.install.outcome }}"
          check "Controlled timeout verification" "${{ steps.timeout_demo.outcome }}"
          check_timeout "Ruff baseline" "${{ steps.ruff.outcome }}" "${{ steps.ruff.outputs.timeout }}"
          check_timeout "mypy baseline" "${{ steps.mypy.outcome }}" "${{ steps.mypy.outputs.timeout }}"
          check "Import layer" "${{ steps.imports.outcome }}"
          check "Runner script tests" "${{ steps.script_tests.outcome }}"
          check_timeout "Unit tests" "${{ steps.unit.outcome }}" "${{ steps.unit.outputs.timeout }}"
          check "Real STS2 CLI discovery" "${{ steps.cli_check.outcome }}"
          check "CLI integration" "${{ steps.cli_tests.outcome }}"
          check "Workflow artifact order" "${{ steps.workflow_artifact_order.outcome }}"

          exit "$failed"
