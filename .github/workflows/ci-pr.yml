name: CI — Pull Request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-debt-autofix:
    name: Ruff Debt Autofix (batch 1)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'quality/ruff-debt-batch-1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install 'ruff==0.16.2'
      - name: Apply selected low-risk fixes
        run: ruff check src tests --fix --select I001,RUF022,F541 --exit-zero
      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No selected Ruff fixes remain."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "quality: remove safe Ruff debt batch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lint:
    name: Lint (ruff)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Check no new Ruff debt
        run: python .github/scripts/check_ruff_baseline.py --baseline-dir .ci-baseline --current-dir .

  mypy:
    name: Type Check (mypy)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev,visual]"
      - name: Check no new mypy debt
        run: python .github/scripts/check_mypy_baseline.py --baseline-dir .ci-baseline --current-dir .

  lint-imports:
    name: Import Layer Check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run lint-imports
        run: lint-imports

  unit-test:
    name: Unit Tests
    needs: [lint, mypy, lint-imports]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Check no new unit-test failures
        run: python .github/scripts/check_pytest_baseline.py
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.os }}
          path: junit-unit.xml

  cli-integration:
    name: CLI Integration Tests
    needs: [unit-test]
    runs-on: ["self-hosted", "macos", "autotest"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project
        run: |
          python3.11 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -e ".[dev]"
      - name: Verify real STS2 CLI is available
        run: |
          .venv-ci/bin/python - <<'PY'
          from sts2_autotest.adapters.discovery import discover_sts2_cli

          cli_path = discover_sts2_cli()
          if cli_path is None:
              raise SystemExit(
                  "STS2 CLI was not found on the self-hosted Mac. "
                  "Set STS2_CLI_PATH for the runner service or install the CLI in a discoverable path."
              )
          print(f"Using STS2 CLI: {cli_path}")
          PY
      - name: Run CLI-only integration tests
        run: .venv-ci/bin/python -m pytest tests/integration/ -v -m "not requires_game" --junitxml=junit-integration.xml
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

  summary:
    name: PR Check Summary
    needs: [lint, mypy, lint-imports, unit-test, cli-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate summary
        run: |
          echo "## B11 CI — PR Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mypy | ${{ needs.mypy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-imports | ${{ needs['lint-imports'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-test | ${{ needs['unit-test'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cli-integration | ${{ needs['cli-integration'].result }} |" >> $GITHUB_STEP_SUMMARY
