name: CI — Pull Request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: PR Check Summary
    runs-on: ["self-hosted", "macos", "autotest"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Runner health precheck (issue-24 T4)
        # 业务验收开始前判定 runner 是否可用（服务状态 + GitHub 网络链路），
        # 不可用则快速失败，避免排队/执行后才发现环境故障
        run: |
          bash scripts/check-runner-health.sh --json
          echo "## Runner Health Precheck" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/check-runner-health.sh --json >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline

      - name: Verify Python 3.11
        id: python
        continue-on-error: true
        run: python3.11 --version

      - name: Install project dev dependencies
        id: install
        if: always() && steps.python.outcome == 'success'
        continue-on-error: true
        run: |
          python3.11 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -e ".[dev]"
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Check no new Ruff debt
        id: ruff
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python .github/scripts/check_ruff_baseline.py --baseline-dir .ci-baseline --current-dir .

      - name: Run lint-imports
        id: imports
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/lint-imports

      - name: Check no new unit-test failures
        id: unit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python .github/scripts/check_pytest_baseline.py

      - name: Verify real STS2 CLI is available
        id: cli_check
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          .venv-ci/bin/python - <<'PY'
          from sts2_autotest.adapters.discovery import discover_sts2_cli

          cli_path = discover_sts2_cli()
          if cli_path is None:
              raise SystemExit(
                  "STS2 CLI was not found on the self-hosted Mac. "
                  "Set STS2_CLI_PATH for the runner service or install the CLI in a discoverable path."
              )
          print(f"Using STS2 CLI: {cli_path}")
          PY

      - name: Run CLI-only integration tests
        id: cli_tests
        if: always() && steps.cli_check.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python -m pytest tests/integration/ -v -m "not requires_game" --junitxml=junit-integration.xml

      - name: Upload unit JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-macos-self-hosted
          path: junit-unit.xml

      - name: Upload integration JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

      - name: Install visual dependency for mypy
        id: visual
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python -m pip install -e ".[visual]"

      - name: Check no new mypy debt
        id: mypy
        if: always() && steps.visual.outcome == 'success'
        continue-on-error: true
        run: .venv-ci/bin/python .github/scripts/check_mypy_baseline.py --baseline-dir .ci-baseline --current-dir .

      - name: Generate summary
        if: always()
        run: |
          echo "## STS2-AUTOTEST — PR Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Daily PR validation currently runs only on the existing self-hosted Mac; GitHub-hosted Linux/Windows duplication is temporarily disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python 3.11 | ${{ steps.python.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Install dev dependencies | ${{ steps.install.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ruff baseline | ${{ steps.ruff.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mypy baseline | ${{ steps.mypy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Import layer | ${{ steps.imports.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | ${{ steps.unit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Real STS2 CLI discovery | ${{ steps.cli_check.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLI integration | ${{ steps.cli_tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce validation result
        if: always()
        run: |
          failed=0
          check() {
            name="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          }

          check "Python 3.11" "${{ steps.python.outcome }}"
          check "Install dev dependencies" "${{ steps.install.outcome }}"
          check "Ruff baseline" "${{ steps.ruff.outcome }}"
          check "mypy baseline" "${{ steps.mypy.outcome }}"
          check "Import layer" "${{ steps.imports.outcome }}"
          check "Unit tests" "${{ steps.unit.outcome }}"
          check "Real STS2 CLI discovery" "${{ steps.cli_check.outcome }}"
          check "CLI integration" "${{ steps.cli_tests.outcome }}"

          exit "$failed"
