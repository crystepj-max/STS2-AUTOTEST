name: CI — Pull Request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 并行阶段 1：代码质量检查 ──

  lint:
    name: Lint (ruff)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Check no new Ruff debt
        run: python .github/scripts/check_ruff_baseline.py --baseline-dir .ci-baseline --current-dir .

  mypy:
    name: Type Check (mypy)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout historical baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev,visual]"
      - name: Check no new mypy debt
        run: python .github/scripts/check_mypy_baseline.py --baseline-dir .ci-baseline --current-dir .

  lint-imports:
    name: Import Layer Check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run lint-imports
        run: lint-imports

  # ── 阶段 2：单元测试（等待阶段 1 全部通过）──

  unit-test:
    name: Unit Tests
    needs: [lint, mypy, lint-imports]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Check no new unit-test failures
        run: python .github/scripts/check_pytest_baseline.py
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.os }}
          path: junit-unit.xml

  # ── 阶段 3：真实 CLI 集成测试（需要自托管 Mac）──

  cli-integration:
    name: CLI Integration Tests
    needs: [unit-test]
    runs-on: ["self-hosted", "macos", "autotest"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run CLI-only integration tests
        run: python -m pytest tests/integration/ -v -m "not requires_game" --junitxml=junit-integration.xml
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

  # ── Job Summary ──

  summary:
    name: PR Check Summary
    needs: [lint, mypy, lint-imports, unit-test, cli-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate summary
        run: |
          echo "## B11 CI — PR Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mypy | ${{ needs.mypy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-imports | ${{ needs['lint-imports'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-test | ${{ needs['unit-test'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cli-integration | ${{ needs['cli-integration'].result }} |" >> $GITHUB_STEP_SUMMARY
