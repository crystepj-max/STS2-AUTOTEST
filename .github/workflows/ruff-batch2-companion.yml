name: Ruff Debt Companion Cleanup — Batch 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'quality/ruff-debt-batch-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install 'ruff==0.16.2'
      - name: Clean companion import findings
        run: ruff check src tests --fix --select I001,F401 --exit-zero
      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No companion fixes remain."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "quality: clean batch 2 companion import findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
